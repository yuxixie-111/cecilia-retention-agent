name: Scheduled ETL

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -c constraints.txt -e .
      - run: python -m scripts.bootstrap --rows 800 --max-iter 1000
      - uses: actions/upload-artifact@v4
        with:
          name: etl-and-predictions
          path: |
            artifacts/etl_report.json
            artifacts/predictions.csv
